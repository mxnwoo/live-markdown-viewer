<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="쓰고, 미리 보고, 링크로 공유하는 간단한 마크다운 편집기." />
    <title>Live Markdown</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <main id="app">
      <div class="document-head">
        <input id="title" aria-label="문서 제목" placeholder="제목" maxlength="120" autocomplete="off" />
        <button id="share" class="icon" aria-label="공유하기"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12" /></svg></button>
      </div>
      <div id="notice" class="notice" role="alert" hidden><span id="notice-text"></span><div id="conflict-actions" hidden><button id="use-remote">최신 내용 불러오기</button><button id="keep-local">내 내용으로 저장</button></div></div>
      <div class="workspace">
        <section id="editor-pane" class="pane editor-pane" aria-label="마크다운 편집"><textarea id="editor" aria-label="마크다운 내용" spellcheck="false"></textarea></section>
        <section class="pane preview-pane" aria-label="미리보기"><article id="preview" class="markdown-body"></article></section>
      </div>
    </main>
    <dialog id="share-dialog" aria-label="공유"><form method="dialog">
      <div class="share-options"><fieldset><legend class="sr-only">공유 권한</legend><label><input type="radio" name="permission" value="view" checked />보기만</label><label><input type="radio" name="permission" value="edit" />편집 가능</label></fieldset><button class="icon close" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg></button></div>
      <p id="share-error" class="error" role="alert" hidden></p>
      <div class="share-link-row"><div id="link-row" hidden><label for="share-link" class="sr-only">공유 링크</label><input id="share-link" readonly /></div><button id="copy-link" type="button" class="icon" aria-label="링크 생성 및 복사"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12" /></svg></button></div>
    </form></dialog>
    <span id="status" class="sr-only" role="status">내 브라우저에 저장</span>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
